# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lsst"
BBFILE_PATTERN_lsst = "^${LAYERDIR}/"
BBFILE_PRIORITY_lsst = "5"
LAYERVERSION_lsst = "1"

LAYERDEPENDS_lsst = "openembedded-layer"

LAYERSERIES_COMPAT_lsst = "nanbield scarthgap"
